# THIRD_PARTY.lock — third-party code Voice Vibe / vvhub builds on (TASK.md rule 1).
# One [[repo]] per upstream. Clones live in ..\Repos\<dir> (shallow, detached at
# `commit`; not in git). `install` says how it is used on this machine.
# Anything copied into this repo keeps its license header + upstream commit.
# Maintained by WS1. Last updated 2026-09-30.

[[repo]]
name = "laya"
url = "https://github.com/NandhaKishorM/laya"
commit = "6d942c92081fbc139e736bbd9ac0023223c29b7f"
license = "Apache-2.0"
role = "Local typed-decision model: routing, policy checks, validation (rule 9)"
install = "PyPI laya==0.3.22 in venvs\\voicevibe (same version as the clone); model convaiinnovations/laya in HF_HOME; INT8 ONNX export in venvs\\models\\laya\\laya.int8.onnx via scripts/export_onnx.py --quantize"
dir = "laya"

[[repo]]
name = "freellmapi"
url = "https://github.com/tashfeenahmed/freellmapi"
commit = "6def0ff0e81f33685b518c24dcd7e99a80ad89d5"
license = "MIT"
role = "Local OpenAI-compatible router over free LLM providers: text + vision only"
install = "Release v0.13.2 FreeLLMAPI-0.13.2-win.zip (portable) unpacked to venvs\\freellmapi\\app; %APPDATA%\\FreeLLMAPI\\config.json port=3001 (desktop default is 31415), bound to 127.0.0.1"
dir = "freellmapi"

