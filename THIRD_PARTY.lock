install = "PyPI windows-mcp==0.8.5 in venvs\\windows-mcp (CPython 3.13.15, uv-managed); config venvs\\windows-mcp\\config.toml excludes PowerShell, Registry, FileSystem; ANONYMIZED_TELEMETRY=false"
