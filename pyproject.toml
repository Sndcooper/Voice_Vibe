[project]
name = "voicevibe-transcriber"
version = "0.1.0"
description = "Press Ctrl+Alt+Space and Voice Vibe listens and types what you say, with an animated overlay."
requires-python = ">=3.10,<3.13"
dependencies = [
    "faster-whisper==1.2.1",
    # 4.6 is the first release with Blackwell (sm_120) kernels. Older builds
    # fail to load on RTX 50-series and silently fall back to CPU.
    "ctranslate2>=4.6.0",
    "sounddevice==0.5.6",
    "numpy==2.2.6",
    "pynput==1.8.2",
    "pyperclip==1.9.0",
    "pystray==0.19.5",
    "pillow==11.3.0",
    "psutil>=5.9",
    # The animated Airoot logo overlay (assets/airoot_overlay.py).
    "PySide6>=6.8,<7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12==12.9.1.4",
    "nvidia-cudnn-cu12==9.13.1.26",
]
# [model].engine = "parakeet" / "auto" on CPU-only machines: NVIDIA Parakeet TDT
# 0.6B v2 int8 via onnx-asr (weights CC-BY-4.0).
parakeet = ["onnx-asr==0.12.0", "onnxruntime==1.30.0"]
# Only to build assets/AirootVoiceOverlay.spec into a standalone exe.
build = ["pyinstaller>=6,<7"]

[project.scripts]
voicevibe = "voicevibe.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicevibe"]
